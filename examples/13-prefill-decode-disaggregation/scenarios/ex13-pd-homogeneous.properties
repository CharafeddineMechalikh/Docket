# Disaggregated serving on identical hardware: separate prefill and decode pools, same card.
#
# The four GPUs of the colocated baseline are the same four GPUs here, only now they are split into a
# prefill pool and a decode pool that never run each other's phase. A prompt is computed on a prefill GPU,
# its finished cache crosses an interconnect, and a decode GPU generates the tokens into a batch that no
# prefill ever interrupts. The hardware is unchanged, so whatever moves between this file and
# ex13-colocated.properties is the effect of separation alone: no faster chip, no specialisation, only the
# two phases pulled apart.
#
# Every figure is SYNTHETIC. The model is an invented 7B decoder, the machine is a round-number card, the
# interconnect is a hand-written capacity and latency, and the workload matches the siblings exactly. Each
# row carries cost_provenance=synthetic.
#
# Run it from the repository root:
#   mvn -q test-compile
#   docket -o examples/13-prefill-decode-disaggregation/results examples/13-prefill-decode-disaggregation/scenarios/ex13-pd-homogeneous.properties

experiment.name=ex13-pd-homogeneous
experiment.durationSeconds=300
experiment.seed=1
experiment.repetitions=3
experiment.outputDir=target/experiments
metrics.samplingIntervalSeconds=0

model.id=edge-chat
model.name=Synthetic 7B decoder
model.architecture=dense-transformer
model.parameterCount=7B
model.layers=32
model.hiddenDimension=4096
model.attentionHeads=32
model.kvHeads=8
model.headDimension=128
model.feedForwardDimension=11008
model.vocabularySize=32000
model.maxContextTokens=4096
model.precision=fp16
model.provenance=synthetic

# One balanced profile cloned into both pools. deployment builds the fleet from the two counts, so the
# "replicas" and "replicas.count" keys of the colocated baseline are deliberately absent here.
devices=gpu
device.gpu.type=accelerator
device.gpu.memoryGiB=24
device.gpu.unusableMemoryFraction=0.05
device.gpu.memoryBandwidthGBs=700
device.gpu.achievedTFLOPS.fp16=100
device.gpu.idlePowerWatts=20
device.gpu.activePowerWatts=300
device.gpu.kernelLaunchOverheadMs=0.02
device.gpu.provenance=synthetic
device.gpu.note=invented balanced accelerator, cloned once per pool member

# One prefill GPU and three decode GPUs, four devices in all. The pools are sized to the traffic, which is
# decode-heavy: a short prompt is prefilled in a fifth of a second but its answer takes a whole batch of
# decode steps, so three of the four identical cards carry the generation and one carries the prompt.
deployment.disaggregated=true
deployment.prefillReplicas=1
deployment.decodeReplicas=3

# A fat, near-zero-latency interconnect, so the transfer the hand-off charges is small next to the phase
# times. A 768-token prompt carries 96 MB of cache; at 50 GB/s that is under two milliseconds, which is why
# the first-token penalty here is the prefill queue, not the wire.
deployment.fabric=fabric
link.fabric.capacityMbps=400000
link.fabric.latencyMs=0.5
link.fabric.provenance=synthetic
link.fabric.note=invented intra-node interconnect, not a measured fabric

replica.maxBatchSize=64
replica.maxPrefillChunkTokens=512
replica.allowPreemption=true
replica.victimOrder=newest-first
replica.abortOnDeadlineMiss=false
replica.tokensPerBlock=16

workload.pattern=poisson
workload.ratePerMinute=300
workload.inputDistribution.name=triangular
workload.inputDistribution.min=128
workload.inputDistribution.mode=512
workload.inputDistribution.max=1536
workload.outputDistribution.name=triangular
workload.outputDistribution.min=48
workload.outputDistribution.mode=160
workload.outputDistribution.max=384
workload.maxOutputTokens=384
workload.prediction=oracle
workload.serviceClass=interactive
workload.ttftTargetSeconds=2
workload.tpotTargetSeconds=0.1
workload.endToEndTargetSeconds=30

policy.admission=unlimited
policy.routing=least-queued
policy.scheduling=fcfs

cost.model=roofline-analytical
