# Colocated serving: every replica runs prefill and decode in one continuous batch.
#
# This is the baseline the two disaggregated siblings are measured against. Four identical GPUs each take
# a fresh prompt, hold its cache, and emit its tokens, so a chunked prefill shares the very step that is
# advancing the sequences already decoding. That sharing is the cost disaggregation removes, and at this
# offered load it shows up in the per-token latency, the batch ceiling and the preemption count.
#
# Every figure is SYNTHETIC. The model is an invented 7B decoder, the four machines are round numbers, and
# the workload is drawn from a triangular distribution, not a capture. Read the three files of this example
# together: what matters is the comparison at a fixed four-device budget, never the latency of a card that
# does not exist. Each row carries cost_provenance=synthetic.
#
# Run it from the repository root:
#   mvn -q test-compile
#   docket -o examples/13-prefill-decode-disaggregation/results examples/13-prefill-decode-disaggregation/scenarios/ex13-colocated.properties

experiment.name=ex13-colocated
experiment.durationSeconds=300
experiment.seed=1
experiment.repetitions=3
experiment.outputDir=target/experiments
metrics.samplingIntervalSeconds=0

# An invented 7B dense decoder: 14 GB of fp16 weights and 128 KB of key-value cache per context token, so
# a 1,536-token prompt reserves 192 MB and a 24 GB card holds only a couple of dozen such sequences before
# it runs out of room and starts preempting.
model.id=edge-chat
model.name=Synthetic 7B decoder
model.architecture=dense-transformer
model.parameterCount=7B
model.layers=32
model.hiddenDimension=4096
model.attentionHeads=32
model.kvHeads=8
model.headDimension=128
model.feedForwardDimension=11008
model.vocabularySize=32000
model.maxContextTokens=4096
model.precision=fp16
model.provenance=synthetic

# One balanced machine profile, cloned four times. Read weights at 700 GB/s and a decode step is about
# twenty milliseconds; compute a 512-token prefill chunk at 100 TFLOPS and it costs tens more, so a chunk
# dropped into a running batch lengthens the step for every sequence in it.
devices=gpu
device.gpu.type=accelerator
device.gpu.memoryGiB=24
device.gpu.unusableMemoryFraction=0.05
device.gpu.memoryBandwidthGBs=700
device.gpu.achievedTFLOPS.fp16=100
device.gpu.idlePowerWatts=20
device.gpu.activePowerWatts=300
device.gpu.kernelLaunchOverheadMs=0.02
device.gpu.provenance=synthetic
device.gpu.note=invented balanced accelerator, cloned once per replica

# A colocated batch mixes a chunked prefill into the step that advances the running decodes, so when the
# cache fills the newest victim is suspended and recomputed later.
replicas=gpu,gpu,gpu,gpu
replica.maxBatchSize=64
replica.maxPrefillChunkTokens=512
replica.allowPreemption=true
replica.victimOrder=newest-first
replica.abortOnDeadlineMiss=false
replica.tokensPerBlock=16

# Traffic tuned so the four replicas are busy rather than idle: prompts long enough to be expensive to
# prefill, a rate high enough that requests wait, and outputs long enough that many sequences share a batch.
workload.pattern=poisson
workload.ratePerMinute=300
workload.inputDistribution.name=triangular
workload.inputDistribution.min=128
workload.inputDistribution.mode=512
workload.inputDistribution.max=1536
workload.outputDistribution.name=triangular
workload.outputDistribution.min=48
workload.outputDistribution.mode=160
workload.outputDistribution.max=384
workload.maxOutputTokens=384
workload.prediction=oracle
workload.serviceClass=interactive
workload.ttftTargetSeconds=2
workload.tpotTargetSeconds=0.1
workload.endToEndTargetSeconds=30

policy.admission=unlimited
policy.routing=least-queued
policy.scheduling=fcfs

cost.model=roofline-analytical
