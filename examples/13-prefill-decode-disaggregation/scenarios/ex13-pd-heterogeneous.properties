# Disaggregated serving on specialised hardware: a compute pool prefills, a memory-rich pool decodes.
#
# Same four-device budget again, but the pools now run different cards chosen for their phase. Prefill is
# compute-bound, so it takes the card with more floating-point throughput; decode is memory-bound, so it
# takes the card with more bandwidth and enough capacity to hold a wide batch. This file answers the
# question the homogeneous sibling leaves open: how much of disaggregation's value is simply the freedom to
# buy each pool the machine its phase actually wants.
#
# Every figure is SYNTHETIC. The two cards and the interconnect are hand-written round numbers, and the
# workload matches the siblings exactly. Compare the three files together; the latency of cards that do not
# exist is not the point. Each row carries cost_provenance=synthetic.
#
# Run it from the repository root:
#   mvn -q test-compile
#   docket -o examples/13-prefill-decode-disaggregation/results examples/13-prefill-decode-disaggregation/scenarios/ex13-pd-heterogeneous.properties

experiment.name=ex13-pd-heterogeneous
experiment.durationSeconds=300
experiment.seed=1
experiment.repetitions=3
experiment.outputDir=target/experiments
metrics.samplingIntervalSeconds=0

model.id=edge-chat
model.name=Synthetic 7B decoder
model.architecture=dense-transformer
model.parameterCount=7B
model.layers=32
model.hiddenDimension=4096
model.attentionHeads=32
model.kvHeads=8
model.headDimension=128
model.feedForwardDimension=11008
model.vocabularySize=32000
model.maxContextTokens=4096
model.precision=fp16
model.provenance=synthetic

# The first declared profile is the prefill pool, the second the decode pool: deployment reads the two
# stages off the order of the "devices" list.
devices=compute,memcard

device.compute.type=accelerator
device.compute.memoryGiB=24
device.compute.unusableMemoryFraction=0.05
device.compute.memoryBandwidthGBs=700
device.compute.achievedTFLOPS.fp16=150
device.compute.idlePowerWatts=20
device.compute.activePowerWatts=350
device.compute.kernelLaunchOverheadMs=0.02
device.compute.provenance=synthetic
device.compute.note=invented compute-rich card, bought for the prefill pool

device.memcard.type=accelerator
device.memcard.memoryGiB=80
device.memcard.unusableMemoryFraction=0.05
device.memcard.memoryBandwidthGBs=3350
device.memcard.achievedTFLOPS.fp16=60
device.memcard.idlePowerWatts=30
device.memcard.activePowerWatts=400
device.memcard.kernelLaunchOverheadMs=0.02
device.memcard.provenance=synthetic
device.memcard.note=invented bandwidth-rich card, bought for the decode pool

deployment.disaggregated=true
deployment.prefillReplicas=1
deployment.decodeReplicas=3
deployment.fabric=fabric
link.fabric.capacityMbps=400000
link.fabric.latencyMs=0.5
link.fabric.provenance=synthetic
link.fabric.note=invented intra-node interconnect, not a measured fabric

replica.maxPrefillChunkTokens=512
replica.allowPreemption=true
replica.victimOrder=newest-first
replica.abortOnDeadlineMiss=false
replica.tokensPerBlock=16
# The bandwidth-rich decode pool empties a step in four milliseconds and has room for a batch an order of
# magnitude wider than the 24 GB cards; the compute pool needs only enough batch to keep its units busy.
replica.compute.maxBatchSize=32
replica.memcard.maxBatchSize=192

workload.pattern=poisson
workload.ratePerMinute=300
workload.inputDistribution.name=triangular
workload.inputDistribution.min=128
workload.inputDistribution.mode=512
workload.inputDistribution.max=1536
workload.outputDistribution.name=triangular
workload.outputDistribution.min=48
workload.outputDistribution.mode=160
workload.outputDistribution.max=384
workload.maxOutputTokens=384
workload.prediction=oracle
workload.serviceClass=interactive
workload.ttftTargetSeconds=2
workload.tpotTargetSeconds=0.1
workload.endToEndTargetSeconds=30

policy.admission=unlimited
policy.routing=least-queued
policy.scheduling=fcfs

cost.model=roofline-analytical
