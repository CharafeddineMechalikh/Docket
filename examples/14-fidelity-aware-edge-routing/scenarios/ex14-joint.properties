# Example 14: fidelity and placement as two serving decisions over one tiered fleet.
#
# The workload is an agentic LLM stream with two service classes and one rule each: an agentic
# retrieval call that must answer inside 0.80 s, and a control-reasoning call that must answer
# inside 0.25 s. Both are replayed from a committed trace, so the prompt and the reasoning trace of
# every request are drawn once and are the same in every arm of the comparison.
#
# The deployment is a tiered fleet: one phone-class accelerator, two on-premise servers behind a
# local bearer and one cloud card behind a wide-area hop. What makes a request cheap or expensive is
# decided by the serving machinery, not asserted by the scenario: the prefill is charged on the
# prompt, the decode on the batch the machine is holding, the cache in whole blocks, and the hop in
# bytes on a bearer.
#
# Every figure in this file is SYNTHETIC. The model is an invented 1B decoder, the three devices are
# round numbers an order of magnitude apart, and the trace was generated by make_agentic_trace.py
# rather than recorded. Read the results as a comparison of serving rules under a known cost model,
# never as a prediction about hardware: the artifacts repeat this as cost_provenance=synthetic.
#
# Run it from the repository root:
#   mvn -q test-compile
#   docket -o examples/14-fidelity-aware-edge-routing/results \
#       examples/14-fidelity-aware-edge-routing/scenarios/ex14-joint.properties

experiment.name=ex14-joint
experiment.durationSeconds=300
experiment.seed=1
experiment.repetitions=3
experiment.outputDir=target/experiments
# The time series is what the KV-cache occupancy figures of the ablation are read from.
metrics.samplingIntervalSeconds=2

# An invented 1B dense decoder: 2 GB of fp16 weights, 24 layers, four key-value heads of 128
# dimensions, which is 48 KB of cache per context token, and an 8192-token window so a long
# retrieved prompt with a long reasoning trace still fits inside it.
model.id=agentic-1b
model.name=Synthetic 1B agentic decoder
model.architecture=dense-transformer
model.parameterCount=1B
model.layers=24
model.hiddenDimension=2048
model.attentionHeads=16
model.kvHeads=4
model.headDimension=128
model.feedForwardDimension=5632
model.vocabularySize=32000
model.maxContextTokens=8192
model.precision=fp16
model.provenance=synthetic

# Three families, an order of magnitude apart on both axes the roofline reads. The edge server is
# the machine the operator wants used; the cloud card is faster but sits behind a wide-area hop.
devices=nano,server,cloud

device.nano.type=edge-device
device.nano.memoryGiB=8
device.nano.unusableMemoryFraction=0.2
device.nano.memoryBandwidthGBs=68
device.nano.achievedTFLOPS.fp16=2
device.nano.idlePowerWatts=4
device.nano.activePowerWatts=15
device.nano.kernelLaunchOverheadMs=0.05
device.nano.provenance=synthetic
device.nano.note=invented mobile-class accelerator; no bearer, its client is on the device

device.server.type=edge-datacenter
device.server.memoryGiB=24
device.server.unusableMemoryFraction=0.05
device.server.memoryBandwidthGBs=700
device.server.achievedTFLOPS.fp16=100
device.server.idlePowerWatts=20
device.server.activePowerWatts=300
device.server.kernelLaunchOverheadMs=0.02
device.server.link=lan
device.server.provenance=synthetic
device.server.note=invented on-premise accelerator, reached over a local bearer

device.cloud.type=cloud-accelerator
device.cloud.memoryGiB=80
device.cloud.unusableMemoryFraction=0.05
device.cloud.memoryBandwidthGBs=3350
device.cloud.achievedTFLOPS.fp16=700
device.cloud.idlePowerWatts=50
device.cloud.activePowerWatts=700
device.cloud.kernelLaunchOverheadMs=0.02
device.cloud.link=wan
device.cloud.provenance=synthetic
device.cloud.note=invented datacenter card, the fast end of the spread, reached over the wide area

# One phone, two on-premise servers and one cloud card. The batch ceiling is a property of the
# machine: a phone holds two sequences, a server holds a batch, the card holds twice as many.
replicas=nano,server,server,cloud
replica.maxPrefillChunkTokens=512
replica.allowPreemption=true
replica.victimOrder=newest-first
replica.tokensPerBlock=16
replica.nano.maxBatchSize=2
replica.server.maxBatchSize=32
replica.cloud.maxBatchSize=64

# The local bearer costs almost nothing and the wide-area hop costs a request the length of a
# fraction of its own deadline: 40 ms of propagation on a 100 Mb/s link, charged on the prompt up
# and on the answer down.
link.lan.capacityMbps=1000
link.lan.latencyMs=2
link.lan.provenance=synthetic
link.wan.capacityMbps=100
link.wan.latencyMs=40
link.wan.provenance=synthetic

# The agentic stream. The overhead levels are four files drawn from one seed: the same requests at
# the same instants, with the prompt and the reasoning trace inflated by the level. The class and
# both objectives come from the trace itself, so the two classes keep their own deadlines.
workload.pattern=trace
workload.traceFile=../data/agentic-overhead-1.0.csv
workload.prediction=trace-observed
workload.maxOutputTokens=2048

# Serving limits, identical in every arm. Admission is left open so that a missed deadline shows up
# as a missed deadline rather than as a refusal, and nothing is aborted: a late answer is still an
# answer the client waited for, and the artifacts time it.
policy.admission=unlimited
policy.scheduling=fcfs
policy.routing.class=com.mechalikh.docket.examples.fidelityedge.JointTierBudgetRouting

# The fidelity ladder, in reasoning tokens. A level is a share of the answer the request asked for,
# so 0.25 of a 480-token trace is a 120-token trace; the floor of 64 tokens is the shortest answer
# the deployment is willing to call an answer. The margin is the slack kept back against a
# prediction error, and it is the same 15% every arm of the comparison uses.
policy.fidelity=deadline-ladder
fidelity.levels=1,0.5,0.25,0.1
fidelity.minTokens=64
fidelity.margin=0.15

cost.model=roofline-analytical
