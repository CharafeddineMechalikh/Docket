# Offload across a bearer only when the prompt is small enough to make the transfer worth it.
#
# A fast accelerator sits on the far side of an access link; a slower machine sits on the client's
# own site. The remote answers in a fraction of the time but the prompt must cross the bearer first.
# The question is not which machine is faster, it is when the transfer tax is small enough that the
# faster one still wins.
#
# Every figure in this file is SYNTHETIC. The model is an invented 1B decoder, the two devices are
# round numbers chosen to sit well apart, and the link is a capacity and a latency written by hand,
# not a measured bearer. Read the results as a comparison of placement rules under a known transfer
# cost, never as a prediction about a network. The artifacts repeat this: each row carries
# cost_provenance=synthetic.
#
# Run it from the repository root:
#   mvn -q test-compile
#   docket -o examples/11-access-link-offloading/results examples/11-access-link-offloading/scenarios/ex11-offload-small-prompts.properties

experiment.name=ex11-offload-small-prompts
experiment.durationSeconds=240
experiment.seed=1
experiment.repetitions=3
experiment.outputDir=target/experiments
metrics.samplingIntervalSeconds=0

# An invented 1B dense decoder: 2 GB of fp16 weights, 48 KB of cache per context token.
model.id=edge-chat
model.name=Synthetic 1B decoder
model.architecture=dense-transformer
model.parameterCount=1B
model.layers=24
model.hiddenDimension=2048
model.attentionHeads=16
model.kvHeads=4
model.headDimension=128
model.feedForwardDimension=5632
model.vocabularySize=32000
model.maxContextTokens=4096
model.precision=fp16
model.provenance=synthetic

# Two machines. The remote is an order of magnitude faster but the client reaches it through a
# bearer; the onsite machine is slower but the request starts the instant it is admitted.
devices=onsite,remote
device.onsite.type=edge-datacenter
device.onsite.memoryGiB=24
device.onsite.unusableMemoryFraction=0.05
device.onsite.memoryBandwidthGBs=700
device.onsite.achievedTFLOPS.fp16=40
device.onsite.idlePowerWatts=20
device.onsite.activePowerWatts=250
device.onsite.kernelLaunchOverheadMs=0.02
device.onsite.provenance=synthetic
device.onsite.note=invented on-premise machine, reachable without an access link

device.remote.type=cloud-accelerator
device.remote.memoryGiB=80
device.remote.unusableMemoryFraction=0.05
device.remote.memoryBandwidthGBs=3350
device.remote.achievedTFLOPS.fp16=700
device.remote.idlePowerWatts=50
device.remote.activePowerWatts=700
device.remote.kernelLaunchOverheadMs=0.02
device.remote.provenance=synthetic
device.remote.note=invented datacenter card, reached through the wan bearer
device.remote.link=wan

# A narrow, far bearer. A text prompt is only kilobytes, so the transfer is invisible on a fat link
# and decisive on a constrained one: 50 kbps carries a 1,200-token prompt (4.8 KB) in 0.77 s, which
# alone busts a 0.5 s first-token target. This is the regime where where a request is served matters.
link.wan.capacityMbps=0.05
link.wan.latencyMs=150
link.wan.bytesPerInputToken=4
link.wan.bytesPerOutputToken=4
link.wan.provenance=synthetic
link.wan.note=invented narrow-band access link, not a measured bearer

# One replica per machine, so the only thing that changes where a request goes is the policy.
replicas=onsite,remote
replica.maxPrefillChunkTokens=512
replica.allowPreemption=true
replica.victimOrder=newest-first
replica.tokensPerBlock=16
replica.onsite.maxBatchSize=16
replica.remote.maxBatchSize=64

# Chat traffic whose prompts straddle the threshold: some cross the bearer quickly, some do not.
# The rate is kept low so neither machine saturates and the difference that shows up is the link,
# not the queue.
workload.pattern=poisson
workload.ratePerMinute=20
workload.inputDistribution.name=triangular
workload.inputDistribution.min=48
workload.inputDistribution.mode=200
workload.inputDistribution.max=1200
workload.outputDistribution.name=triangular
workload.outputDistribution.min=32
workload.outputDistribution.mode=120
workload.outputDistribution.max=512
workload.maxOutputTokens=512
workload.prediction=oracle
workload.serviceClass=interactive
workload.ttftTargetSeconds=0.5
workload.tpotTargetSeconds=0.1
workload.endToEndTargetSeconds=25

policy.admission=unlimited
policy.routing.class=com.mechalikh.docket.examples.offload.OffloadByPromptSizeRouting
policy.scheduling=fcfs

cost.model=roofline-analytical
