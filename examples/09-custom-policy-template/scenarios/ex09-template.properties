# The template policy, loaded from its class name. Copy the class, change the order, change the
# name, and point another scenario at the copy.
#
# Every figure in this file is synthetic: the device, the model and the cost model describe no
# measured accelerator. Read the results as a check of the policy mechanics, never as a hardware
# prediction.
#
# Run it from the repository root:
#   docket -o examples/09-custom-policy-template/results examples/09-custom-policy-template/scenarios/ex09-template.properties

experiment.name=ex09-template
experiment.durationSeconds=220
experiment.seed=1
# A replayed trace draws nothing at random, so a repetition is bit-identical to the one before
# it and one repetition is enough. The sweep in example 08 changes the policy, not the seed.
experiment.repetitions=1
experiment.outputDir=target/experiments
metrics.samplingIntervalSeconds=0.5

# One synthetic 7B decoder held by every replica.
model.id=sla-mix
model.name=Synthetic 7B decoder
model.architecture=dense-transformer
model.parameterCount=7B
model.layers=32
model.hiddenDimension=4096
model.attentionHeads=32
model.kvHeads=32
model.headDimension=128
model.feedForwardDimension=11008
model.vocabularySize=32000
model.maxContextTokens=8192
model.precision=fp16
model.provenance=synthetic

device.id=gpu-80g
device.type=accelerator
device.memoryGiB=80
device.unusableMemoryFraction=0.05
device.memoryBandwidthGBs=3350
device.achievedTFLOPS.fp16=700
device.peakTFLOPS.fp16=989
device.idlePowerWatts=50
device.activePowerWatts=700
device.kernelLaunchOverheadMs=0.02
device.hostToDeviceBandwidthGBs=64
device.hostTransferLatencyMs=0.1
device.provenance=synthetic
device.note=round 80 GiB figures chosen to hold long prompts, not a measured card

replicas.count=1
replica.maxBatchSize=32
replica.maxPrefillChunkTokens=512
replica.allowPreemption=true
replica.victimOrder=newest-first
replica.abortOnDeadlineMiss=false
replica.tokensPerBlock=16

# Two classes from one synthetic trace: interactive turns with a 1.5 s first-token target and a
# 15 s end-to-end target, batch work with a 15 s and a 300 s target. The targets travel with each
# row, so slo.csv separates the two classes.
workload.pattern=trace
workload.traceFile=../../data/sla-mix.csv
workload.traceTimeScale=1
workload.maxOutputTokens=1024
workload.prediction=trace-observed

policy.admission=unlimited
policy.routing=least-queued
policy.scheduling.class=com.mechalikh.docket.examples.template.TemplateScheduling

cost.model=roofline-analytical
