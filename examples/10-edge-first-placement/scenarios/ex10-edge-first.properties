# Tiered placement over a heterogeneous fleet: the cheapest tier that can hold the request.
#
# Four machines of three different families serve one small decoder. The question is not whether
# the fleet can answer, it can: it is where the operator wants the answer to come from, and what
# that preference costs the requests that wait for it.
#
# Every figure in this file is SYNTHETIC. The model is an invented 1B decoder sized so that its
# weights fit beside a useful cache on an 8 GiB mobile accelerator, and the three devices are round
# numbers chosen to sit an order of magnitude apart, not cards. Read the results as a comparison of
# placement rules under a known spread of service times, never as a prediction about hardware. The
# artifacts repeat this: each row carries cost_provenance=synthetic.
#
# Run it from the repository root:
#   mvn -q test-compile
#   docket -o examples/10-edge-first-placement/results examples/10-edge-first-placement/scenarios/ex10-edge-first.properties

experiment.name=ex10-edge-first
experiment.durationSeconds=240
experiment.seed=1
# Three repetitions of a seeded arrival process: the pooled percentiles answer what the deployment
# does to a request, the repetition spread answers how much of that is the seed.
experiment.repetitions=3
experiment.outputDir=target/experiments
metrics.samplingIntervalSeconds=0

# An invented 1B dense decoder: 2 GB of fp16 weights, 24 layers, four key-value heads of 128
# dimensions, which is 48 KB of cache per context token.
model.id=edge-chat
model.name=Synthetic 1B decoder
model.architecture=dense-transformer
model.parameterCount=1B
model.layers=24
model.hiddenDimension=2048
model.attentionHeads=16
model.kvHeads=4
model.headDimension=128
model.feedForwardDimension=5632
model.vocabularySize=32000
model.maxContextTokens=4096
model.precision=fp16
model.provenance=synthetic

# Three families, one order of magnitude apart on both axes the roofline reads.
devices=nano,server,cloud
device.nano.type=edge-device
device.nano.memoryGiB=8
device.nano.unusableMemoryFraction=0.2
device.nano.memoryBandwidthGBs=68
device.nano.achievedTFLOPS.fp16=2
device.nano.idlePowerWatts=4
device.nano.activePowerWatts=15
device.nano.kernelLaunchOverheadMs=0.05
device.nano.provenance=synthetic
device.nano.note=invented mobile-class machine, sized so a 1B decoder fits beside its cache

device.server.type=edge-datacenter
device.server.memoryGiB=24
device.server.unusableMemoryFraction=0.05
device.server.memoryBandwidthGBs=700
device.server.achievedTFLOPS.fp16=100
device.server.idlePowerWatts=20
device.server.activePowerWatts=300
device.server.kernelLaunchOverheadMs=0.02
device.server.provenance=synthetic
device.server.note=invented on-premise machine, one order of magnitude above the edge device

device.cloud.type=cloud-accelerator
device.cloud.memoryGiB=80
device.cloud.unusableMemoryFraction=0.05
device.cloud.memoryBandwidthGBs=3350
device.cloud.achievedTFLOPS.fp16=700
device.cloud.idlePowerWatts=50
device.cloud.activePowerWatts=700
device.cloud.kernelLaunchOverheadMs=0.02
device.cloud.provenance=synthetic
device.cloud.note=invented datacenter card, the fast end of the spread

# Four replicas over three families. The batch ceiling is a property of the machine, so it is
# written per profile: a phone-class device holds two sequences, a server holds a batch.
replicas=nano,nano,server,cloud
replica.maxPrefillChunkTokens=512
replica.allowPreemption=true
replica.victimOrder=newest-first
replica.tokensPerBlock=16
replica.nano.maxBatchSize=2
replica.server.maxBatchSize=32
replica.cloud.maxBatchSize=64

# Chat traffic: short prompts, short answers, a rate that keeps two edge devices interestingly
# busy without emptying the cloud card. Every request states the same three objectives, so the
# service level columns and the budget guard have something to work with.
workload.pattern=poisson
workload.ratePerMinute=60
workload.inputDistribution.name=triangular
workload.inputDistribution.min=48
workload.inputDistribution.mode=180
workload.inputDistribution.max=900
workload.outputDistribution.name=triangular
workload.outputDistribution.min=16
workload.outputDistribution.mode=64
workload.outputDistribution.max=256
workload.maxOutputTokens=512
workload.prediction=oracle
workload.serviceClass=interactive
workload.ttftTargetSeconds=2
workload.tpotTargetSeconds=0.1
workload.endToEndTargetSeconds=25

policy.admission=unlimited
policy.routing.class=com.mechalikh.docket.examples.edgefirst.EdgeFirstRouting
policy.scheduling=fcfs

cost.model=roofline-analytical
