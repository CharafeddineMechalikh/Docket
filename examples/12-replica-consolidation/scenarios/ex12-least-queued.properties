# Consolidate a fleet of identical replicas: pack requests to fill batches instead of spreading them.
#
# Four interchangeable machines serve one small decoder. A load balancer opens a fresh replica the
# moment one has any work, which is the fastest way to answer a single request but leaves every
# machine running a batch of one. This example runs the opposite rule, and a bounded version of it,
# over the same traffic: the question is what filling batches costs in latency and buys in energy, on
# a fleet where the machines are clones so nothing but the placement changes.
#
# Every figure in this file is SYNTHETIC. The model is the invented 1B decoder from example 10 and the
# device is a round-number on-premise machine, not a measured card. Read the results as a comparison
# of placement rules under a known service time, never as a prediction about hardware. The artifacts
# repeat this: each row carries cost_provenance=synthetic.
#
# Run it from the repository root:
#   mvn -q test-compile
#   docket -o examples/12-replica-consolidation/results examples/12-replica-consolidation/scenarios/ex12-consolidate.properties

experiment.name=ex12-least-queued
experiment.durationSeconds=240
experiment.seed=1
# Three repetitions of a seeded arrival process: the pooled numbers answer what the placement does to
# a request, the repetition spread answers how much of that is the seed.
experiment.repetitions=3
experiment.outputDir=target/experiments
metrics.samplingIntervalSeconds=0

# An invented 1B dense decoder: 2 GB of fp16 weights, 24 layers, four key-value heads of 128
# dimensions, which is 48 KB of cache per context token. Same model as example 10.
model.id=edge-chat
model.name=Synthetic 1B decoder
model.architecture=dense-transformer
model.parameterCount=1B
model.layers=24
model.hiddenDimension=2048
model.attentionHeads=16
model.kvHeads=4
model.headDimension=128
model.feedForwardDimension=5632
model.vocabularySize=32000
model.maxContextTokens=4096
model.precision=fp16
model.provenance=synthetic

# One device profile, four clones of it. The batch ceiling is high so a packed replica can actually
# form a large batch; the mid-range power figures make the idle-versus-active difference the example
# is about readable. Every machine is interchangeable, so a placement difference is a batching
# difference.
device.id=server
device.type=accelerator
device.memoryGiB=24
device.unusableMemoryFraction=0.05
device.memoryBandwidthGBs=700
device.achievedTFLOPS.fp16=100
device.idlePowerWatts=20
device.activePowerWatts=300
device.kernelLaunchOverheadMs=0.02
device.provenance=synthetic
device.note=invented on-premise machine, four identical clones of it

replicas.count=4
replica.maxBatchSize=32
replica.maxPrefillChunkTokens=512
replica.allowPreemption=true
replica.victimOrder=newest-first
replica.tokensPerBlock=16

# A chat mix dense enough that a balancer keeps all four replicas active and a packing rule can grow
# a real batch on one of them. Prompts and answers are the same short-triangle shape example 10 uses,
# with a rate chosen so the packed single replica stays below saturation: deep enough to show the
# batching win, not so deep that it collapses the service level.
workload.pattern=poisson
workload.ratePerMinute=2400
workload.inputDistribution.name=triangular
workload.inputDistribution.min=48
workload.inputDistribution.mode=180
workload.inputDistribution.max=900
workload.outputDistribution.name=triangular
workload.outputDistribution.min=16
workload.outputDistribution.mode=64
workload.outputDistribution.max=256
workload.maxOutputTokens=512
workload.prediction=oracle
workload.serviceClass=interactive
workload.ttftTargetSeconds=2
workload.tpotTargetSeconds=0.1
workload.endToEndTargetSeconds=25

policy.admission=unlimited
policy.routing=least-queued
policy.scheduling=fcfs

cost.model=roofline-analytical
