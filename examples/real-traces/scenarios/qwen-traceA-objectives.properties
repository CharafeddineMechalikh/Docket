# Qwen-Bailian trace A replayed with the objectives an operator would state per class.
#
# Same window, model, device and policies as qwen-traceA.properties, with one difference: the
# scenario states what each service class is promised. A recorded production trace carries the
# arrivals and the lengths, but not the service-level objectives the operator promised, which is
# why the plain replay reports goodput as not applicable. The four objectives below are therefore
# an assumption of this scenario, not a figure read from the trace, and they are the only inputs
# here that a reader cannot check against the recording.
#
# They are written as a product team would write them: an interactive chat turn has half a second
# to its first token and must then stream faster than 50 tokens per second, a search or image
# request is allowed more, and a file upload is a background job.
#
# Run it:
#   java -jar target/docket-1.0.1.jar examples/real-traces/scenarios/qwen-traceA-objectives.properties


experiment.name=qwen-traceA-objectives
experiment.durationSeconds=1100
experiment.seed=1
experiment.repetitions=1
experiment.outputDir=target/experiments
metrics.samplingIntervalSeconds=0.5

model.id=qwen-traceA
model.name=Synthetic 7B decoder
model.architecture=dense-transformer
model.parameterCount=7B
model.layers=32
model.hiddenDimension=4096
model.attentionHeads=32
model.kvHeads=32
model.headDimension=128
model.feedForwardDimension=11008
model.vocabularySize=32000
model.maxContextTokens=32768
model.precision=fp16
model.provenance=synthetic

device.id=gpu-80g
device.type=accelerator
device.memoryGiB=80
device.unusableMemoryFraction=0.05
device.memoryBandwidthGBs=3350
device.achievedTFLOPS.fp16=700
device.peakTFLOPS.fp16=989
device.idlePowerWatts=50
device.activePowerWatts=700
device.kernelLaunchOverheadMs=0.02
device.provenance=synthetic
device.note=round 80 GiB figures chosen to hold long prompts, not a measured card

replicas.count=1
replica.maxBatchSize=64
replica.maxPrefillChunkTokens=512
replica.allowPreemption=true
replica.victimOrder=newest-first
replica.abortOnDeadlineMiss=false
replica.tokensPerBlock=16

# The trace supplies the arrivals and both lengths; the classes come from the recorded request
# type. The objectives below are stated per class, so a request inherits the ones of its class and
# goodput is measured instead of being reported as not applicable.
workload.pattern=trace
workload.traceFile=../data/qwen-traceA.csv
workload.traceTimeScale=1
workload.maxOutputTokens=4096
workload.prediction=trace-observed
workload.serviceClass=default

workload.ttftTargetSeconds.text=0.5
workload.endToEndTargetSeconds.text=20
workload.tpotTargetSeconds.text=0.02

workload.ttftTargetSeconds.search=2
workload.endToEndTargetSeconds.search=60
workload.tpotTargetSeconds.search=0.05

workload.ttftTargetSeconds.image=2
workload.endToEndTargetSeconds.image=60
workload.tpotTargetSeconds.image=0.05

workload.ttftTargetSeconds.file=5
workload.endToEndTargetSeconds.file=180
workload.tpotTargetSeconds.file=0.1

policy.admission=unlimited
policy.routing=least-queued
policy.scheduling=fcfs

cost.model=roofline-analytical
