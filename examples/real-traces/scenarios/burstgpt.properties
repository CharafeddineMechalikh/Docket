# BurstGPT, the bursty workload AI Perf replays, 600 recorded requests.
#
# The arrivals and both lengths come from the first hours of BurstGPT, which records ten days of
# traffic to a commercial chatbot and is the bursty public dataset NVIDIA's AI Perf replays. The
# window is the densest burst in the first 4 MB, 600 requests in 54 seconds. Most of them are API
# calls with very short outputs, so the run is a queue under a sharp burst rather than a
# conversation workload. NVIDIA publishes no request-level serving trace of its own; this is the
# dataset its tooling uses, not an NVIDIA-operated service.
#
# Run it:
#   java -jar target/genai-inference-sim-1.0.1.jar examples/real-traces/scenarios/burstgpt.properties


experiment.name=burstgpt
experiment.durationSeconds=120
experiment.seed=1
experiment.repetitions=1
experiment.outputDir=target/experiments
metrics.samplingIntervalSeconds=0.5

model.id=burstgpt
model.name=Synthetic 7B decoder
model.architecture=dense-transformer
model.parameterCount=7B
model.layers=32
model.hiddenDimension=4096
model.attentionHeads=32
model.kvHeads=32
model.headDimension=128
model.feedForwardDimension=11008
model.vocabularySize=32000
model.maxContextTokens=32768
model.precision=fp16
model.provenance=synthetic

device.id=gpu-80g
device.type=accelerator
device.memoryGiB=80
device.unusableMemoryFraction=0.05
device.memoryBandwidthGBs=3350
device.achievedTFLOPS.fp16=700
device.peakTFLOPS.fp16=989
device.idlePowerWatts=50
device.activePowerWatts=700
device.kernelLaunchOverheadMs=0.02
device.hostToDeviceBandwidthGBs=64
device.hostTransferLatencyMs=0.1
device.provenance=synthetic
device.note=round 80 GiB figures chosen to hold long prompts, not a measured card

replicas.count=1
replica.maxBatchSize=64
replica.maxPrefillChunkTokens=512
replica.allowPreemption=true
replica.victimOrder=newest-first
replica.abortOnDeadlineMiss=false
replica.tokensPerBlock=16

# The trace supplies the arrivals and both lengths. It carries no service-level targets, so the
# SLO columns of the run are not applicable rather than met or missed.
workload.pattern=trace
workload.traceFile=../data/burstgpt.csv
workload.traceTimeScale=1
workload.maxOutputTokens=4096
workload.prediction=trace-observed
workload.serviceClass=default

policy.admission=unlimited
policy.routing=least-queued
policy.scheduling=fcfs

cost.model=roofline-analytical
