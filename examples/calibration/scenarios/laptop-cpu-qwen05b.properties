# One real serving engine on one real device: llama.cpp on the laptop CPU that ran the benchmark.
#
# The device coefficients are measured by this project, not chosen. examples/calibration/fit.py
# fits them to the llama-bench captures next to this file: prefill of 256, 512 and 1024 tokens
# gives the achieved throughput, and batch-1 decode gives the effective memory bandwidth. The
# model dimensions are read from the GGUF metadata of the benchmarked file and match the
# publisher's config.json. The cost model is roofline-calibrated, so a completed run prints
# `overall provenance : measured`.
#
# What the measured label covers: prefill steps of 256 to 1024 tokens, and decode of one
# sequence at the contexts the benchmark reached. The device figures are effective, so they
# absorb the CPU backend's kernel inefficiency instead of describing a datasheet.
#
# The workload offers three requests with a 512-token prompt and a 64-token output, thirty
# seconds apart, so no request queues behind another and each one meets the fitted regime.
#
# Power coefficients are left at zero until the whole-system battery measurement is recorded;
# energy is therefore not modelled by this scenario yet.
#
# Run it:
#   java -jar target/docket-1.1.0.jar examples/calibration/scenarios/laptop-cpu-qwen05b.properties


experiment.name=laptop-cpu-qwen05b
experiment.durationSeconds=90
experiment.seed=1
experiment.repetitions=1
experiment.outputDir=target/experiments
metrics.samplingIntervalSeconds=1

model.id=qwen2.5-0.5b-instruct
model.name=Qwen2.5-0.5B-Instruct
model.architecture=dense-transformer
model.parameterCount=494032768
model.layers=24
model.hiddenDimension=896
model.attentionHeads=14
model.kvHeads=2
model.headDimension=64
model.feedForwardDimension=4864
model.vocabularySize=151936
model.maxContextTokens=32768
model.precision=fp16
model.provenance=measured

device.id=laptop-cpu
device.type=cpu
device.memoryGiB=7.84
device.unusableMemoryFraction=0.10
device.memoryBandwidthGBs=10.096
device.achievedTFLOPS.fp16=0.0844
device.idlePowerWatts=0
device.activePowerWatts=0
device.kernelLaunchOverheadMs=0
device.provenance=measured
device.note=Intel Core i7-8550U, 4 threads, llama.cpp b12014 CPU backend, measured 2026-10-30

replicas.count=1
replica.maxBatchSize=1
replica.maxPrefillChunkTokens=1024
replica.allowPreemption=false
replica.tokensPerBlock=16

workload.pattern=fixed
workload.intervalSeconds=30
workload.maxRequests=3
workload.inputDistribution.name=constant
workload.inputDistribution.value=512
workload.outputDistribution.name=constant
workload.outputDistribution.value=64
workload.maxOutputTokens=64
workload.prediction=oracle
workload.serviceClass=calibration

policy.admission=unlimited
policy.routing=least-queued
policy.scheduling=fcfs

cost.model=roofline-calibrated
cost.calibration.source=llama.cpp b12014, Qwen2.5-0.5B-Instruct f16, Intel Core i7-8550U 4 threads, measured 2026-10-30
cost.supportedMaxBatchSize=1
cost.supportedMaxStepTokens=1024
