# Single GPU, Poisson arrivals, continuous batching with preemption.
#
# Every figure in this file is SYNTHETIC. The device describes no real accelerator: its achieved
# throughput and bandwidth are chosen so that the prefill of a long prompt and the decode of a
# large batch differ by the factor a roofline model predicts, not because that is what some card
# does. Read the results as a check of the simulator's mechanics, never as a prediction about
# hardware. The artifacts repeat this: each row carries cost_provenance=synthetic, and the weakest
# provenance among the inputs is what the console prints as the overall provenance.
#
# Run it:
#   docket scenarios/single-gpu-poisson.properties
# Override anything from the command line without editing the file:
#   docket -r 10 -s 2024 scenarios/single-gpu-poisson.properties

experiment.name=single-gpu-poisson
experiment.durationSeconds=60
experiment.seed=1
experiment.repetitions=3
experiment.outputDir=target/experiments
metrics.samplingIntervalSeconds=1

# A 124M-parameter dense decoder, sized so that one device holds the weights, the cache and the
# activations without the run being about memory pressure.
model.id=tiny-124m
model.name=Synthetic 124M decoder
model.architecture=dense-transformer
model.parameterCount=124M
model.layers=12
model.hiddenDimension=768
model.attentionHeads=12
model.kvHeads=12
model.headDimension=64
model.feedForwardDimension=3072
model.vocabularySize=50257
model.maxContextTokens=2048
model.precision=fp16
model.provenance=synthetic

device.id=gpu-synthetic
device.type=accelerator
device.memoryGiB=24
device.unusableMemoryFraction=0.05
device.memoryBandwidthGBs=700
device.achievedTFLOPS.fp16=100
device.peakTFLOPS.fp16=150
device.idlePowerWatts=20
device.activePowerWatts=150
device.kernelLaunchOverheadMs=0.02
device.hostToDeviceBandwidthGBs=32
device.hostTransferLatencyMs=0.1
device.provenance=synthetic
device.note=invented dimensions, chosen to exercise the roofline rather than to describe a card

replicas.count=1
replica.maxBatchSize=32
replica.maxPrefillChunkTokens=512
replica.allowPreemption=true
replica.victimOrder=newest-first
replica.abortOnDeadlineMiss=false
replica.tokensPerBlock=16

# Six requests per minute for sixty seconds is about six arrivals: a load a single replica serves
# without queueing much. Raise workload.ratePerMinute to make it wait, which is the point of the
# scenario: it shows TTFT detaching from the service time as the queue grows.
workload.pattern=poisson
workload.ratePerMinute=6
workload.inputDistribution.name=triangular
workload.inputDistribution.min=64
workload.inputDistribution.mode=512
workload.inputDistribution.max=2048
workload.outputDistribution.name=triangular
workload.outputDistribution.min=16
workload.outputDistribution.mode=128
workload.outputDistribution.max=512
workload.maxOutputTokens=1024
workload.prediction=oracle
workload.serviceClass=interactive
# Targets stated per request so that the service level columns are not empty. A target of zero
# means "not stated", which is reported as not applicable rather than as met.
workload.ttftTargetSeconds=1
workload.tpotTargetSeconds=0.05
workload.endToEndTargetSeconds=15

policy.admission=unlimited
policy.routing=least-queued
policy.scheduling=fcfs

cost.model=roofline-analytical
