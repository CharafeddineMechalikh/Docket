# One GPU under real pressure: a 7B decoder whose weights leave little cache, bursty arrivals.
#
# Same synthetic device as single-gpu-poisson.properties, but the model is three orders of
# magnitude larger, which is what makes the interesting mechanisms fire. The weights take most of
# the memory, so the paged cache holds only a handful of concurrent sequences and the batch stops
# growing long before replica.maxBatchSize; the prompt prefill costs a fifth of a second, so chunked
# prefill matters; and arrivals outrun the device, so the queue grows, time-to-first-token separates
# from the service time and the head-of-line is what the scheduler chooses.
#
# The numbers are SYNTHETIC. They are chosen so that the roofline terms are of comparable size
# (weights, cache bytes and floating point work all take about the same time per step), not because
# any card behaves like this. Read the run as a test of the simulator's mechanics.
#
# Run it:
#   docket scenarios/loaded-7b-memory-pressure.properties

experiment.name=loaded-7b-memory-pressure
experiment.durationSeconds=30
experiment.seed=1
experiment.repetitions=3
experiment.outputDir=target/experiments
metrics.samplingIntervalSeconds=0.5

model.id=big-7b
model.name=Synthetic 7B decoder
model.architecture=dense-transformer
model.parameterCount=7B
model.layers=32
model.hiddenDimension=4096
model.attentionHeads=32
model.kvHeads=32
model.headDimension=128
model.feedForwardDimension=11008
model.vocabularySize=32000
model.maxContextTokens=4096
model.precision=fp16
model.provenance=synthetic

device.id=gpu-synthetic
device.type=accelerator
device.memoryGiB=24
device.unusableMemoryFraction=0.05
device.memoryBandwidthGBs=700
device.achievedTFLOPS.fp16=100
device.peakTFLOPS.fp16=150
device.idlePowerWatts=20
device.activePowerWatts=150
device.kernelLaunchOverheadMs=0.02
device.provenance=synthetic
device.note=invented dimensions, chosen to exercise the roofline rather than to describe a card

replicas.count=1
replica.maxBatchSize=32
replica.maxPrefillChunkTokens=512
replica.allowPreemption=true
replica.victimOrder=newest-first
replica.abortOnDeadlineMiss=false
replica.tokensPerBlock=16

# Two requests per second: the device serves about one and a half, so the queue grows over the run
# instead of draining between bursts. That is the regime the metrics change shape in.
workload.pattern=poisson
workload.ratePerMinute=120
workload.inputDistribution.name=triangular
workload.inputDistribution.min=128
workload.inputDistribution.mode=1024
workload.inputDistribution.max=2048
workload.outputDistribution.name=triangular
workload.outputDistribution.min=16
workload.outputDistribution.mode=128
workload.outputDistribution.max=512
workload.maxOutputTokens=1024
workload.prediction=oracle
workload.serviceClass=interactive
workload.ttftTargetSeconds=2
workload.tpotTargetSeconds=0.1
workload.endToEndTargetSeconds=30

policy.admission=unlimited
policy.routing=least-queued
policy.scheduling=fcfs

cost.model=roofline-analytical
